[package]
name = "prover"
version = "0.1.0"
edition = "2024"

[dependencies]
pico-prover = { workspace = true }
fibonacci-lib = { path = "../lib" }

# AOT-only. pico-aot-dispatch is the crate `cargo pico aot` writes to
# ../aot-generated (see README, "AOT mode" section).
pico-aot-dispatch = { path = "../aot-generated", optional = true }

[features]
aot = ["pico-prover/aot", "dep:pico-aot-dispatch"]
