[package]
name = "prover"
version = "0.1.0"
edition = "2024"

[dependencies]
pico-sdk = { workspace = true }
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }
alloy-sol-types = { workspace = true }
fibonacci-lib = { path = "../lib" }

# AOT-only. pico-aot-dispatch is the locally-generated crate written to
# ../aot-generated by `generate_crates` (see README, "AOT mode" section).
pico-vm = { git = "https://github.com/brevis-network/pico", tag = "v2.1.1", optional = true, features = ["aot-emulator"] }
pico-aot-runtime = { git = "https://github.com/brevis-network/pico", tag = "v2.1.1", optional = true }
pico-aot-dispatch = { path = "../aot-generated", optional = true }
tracing = { version = "0.1.40", optional = true }

[features]
aot = ["dep:pico-vm", "dep:pico-aot-runtime", "dep:pico-aot-dispatch", "pico-sdk/aot", "dep:tracing"]
