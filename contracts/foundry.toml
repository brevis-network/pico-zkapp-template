[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
optimizer = true
optimizer_runs = 200
# The test reads its proof from here.
fs_permissions = [{ access = "read", path = "./test_data" }]

[fmt]
# gnark's export, kept byte for byte as the setup wrote it (see test/dev/manifest.json).
ignore = ["test/dev/Groth16Verifier.sol"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
