# Bootstrap stub. Replaced by `cargo pico aot` whenever the guest ELF
# changes. Exists so the prover crate's optional `pico-aot-dispatch` path
# dep resolves, and builds, before any AOT code has been generated.
[package]
name = "pico-aot-dispatch"
version = "0.1.0"
edition = "2021"

[dependencies]
pico-aot-runtime = { git = "https://github.com/brevis-network/pico", tag = "v3.0.0" }

[features]
bigint-rug = ["pico-aot-runtime/bigint-rug"]
mmap-memory = ["pico-aot-runtime/mmap-memory"]

[lib]
path = "src/lib.rs"
