[workspace]
members = [
    "lib",
    "app",
    "prover",
]
resolver = "2"

[workspace.dependencies]
pico-sdk = { git = "https://github.com/brevis-network/pico", tag = "v3.0.0" }
pico-prover = { git = "https://github.com/brevis-network/pico", tag = "v3.0.0" }
serde = { version = "1.0.205", features = ["derive"] }

[profile.release]
codegen-units = 1
